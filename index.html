<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub登录验证码</title>

  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css" />
  <script src="https://unpkg.com/vue@2/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>
  <script src="https://unpkg.com/otpauth@9.1.4/dist/otpauth.umd.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell","Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
    }
    .totp {
      width: 420px;
      max-width: 100%;
      margin: 40px auto;
    }
    .page-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .page-title {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .page-subtitle {
      font-size: 14px;
      color: #666;
    }
    .code {
      text-align: center;
      padding: 20px 0;
    }
    .code span {
      display: inline-block;
      font-size: 28px;
      font-weight: bold;
      border: 1px solid #000;
      padding: 6px 14px;
      border-radius: 6px;
      background-color: #fff;
      letter-spacing: 2px;
    }
    .seconds {
      text-align: center;
      font-size: 12px;
      color: #666;
    }
    .seconds b {
      font-size: 20px;
      color: #006eff;
    }
    .error-message {
      color: #f56c6c;
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1 class="page-title">GitHub登录验证码</h1>
      <p class="page-subtitle">支持GitHub/Google/Microsoft Authenticator</p>
    </div>

    <div class="totp">
      <el-card>
        <el-input v-model.trim="secret" placeholder="请输入 Base32 格式的密钥" :class="{ 'is-error': secretError }">
          <el-button slot="append" @click="initTotp" type="primary">获取</el-button>
        </el-input>
        <div v-if="secretError" class="error-message">{{ secretError }}</div>

        <div class="code" v-if="code">
          <span>{{ code }}</span>
          <!-- 修复后的复制按钮：白底黑字 -->
          <el-button size="mini" @click="copyCode" style="margin-left:10px">
            复制
          </el-button>
        </div>
        <div class="seconds" v-if="code">
          <span>剩余 <b>{{ seconds }}</b> 秒</span>
        </div>
      </el-card>
    </div>
  </div>

  <script>
    new Vue({
      el: "#app",
      data() {
        return {
          totp: null,
          secret: "JBSWY3DPEHPK3PXP", // 默认测试密钥
          code: "",
          seconds: "",
          timerData: null,
          period: 30,
          digits: 6,
          algorithm: "SHA1",
          secretError: ""
        };
      },
      created() {
        this.initTotp();
      },
      methods: {
        initTotp() {
          this.secretError = "";
          if (!this.secret) {
            this.secretError = "请输入密钥";
            return;
          }
          try {
            let totp = new OTPAuth.TOTP({
              issuer: "TOTP Generator",
              label: "User",
              algorithm: this.algorithm,
              digits: this.digits,
              period: this.period,
              secret: this.secret,
            });
            this.totp = totp;
            this.code = totp.generate();
            this.seconds = totp.period - (Math.floor(Date.now() / 1000) % totp.period);
            this.timer();
          } catch (error) {
            this.secretError = "密钥格式错误，请检查 Base32 格式";
            this.code = "";
            this.seconds = "";
          }
        },
        timer() {
          clearInterval(this.timerData);
          this.timerData = setInterval(() => {
            if (this.seconds <= 1) {
              this.initTotp();
              return;
            }
            this.seconds -= 1;
          }, 1000);
        },
        copyCode() {
          if (!this.code) return;
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(this.code)
              .then(() => {
                this.$message.success("验证码已复制");
              })
              .catch(() => {
                this.fallbackCopy(this.code);
              });
          } else {
            this.fallbackCopy(this.code);
          }
        },
        fallbackCopy(text) {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-999999px";
          textArea.style.top = "-999999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          try {
            document.execCommand("copy");
            this.$message.success("验证码已复制");
          } catch (err) {
            this.$message.warning("复制失败，请手动复制");
          }
          document.body.removeChild(textArea);
        }
      },
      beforeDestroy() {
        if (this.timerData) {
          clearInterval(this.timerData);
        }
      }
    });
  </script>
</body>
</html>
